<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <div class="display">
        <div class="calculation">23 x 12</div>
        <div class="calculation-input">7,168</div>
      </div>
      <div class="keypad">
        <button class="key key-span key-fn key-clear" data-btn="clear">
          AC
        </button>
        <button class="key key-fn key-back" data-btn="back">⌫</button>
        <button class="key key-op" data-btn="div">÷</button>
        <button class="key key-num" data-btn="7">7</button>
        <button class="key key-num" data-btn="8">8</button>
        <button class="key key-num" data-btn="9">9</button>
        <button class="key key-op" data-btn="multiply">×</button>

        <button class="key key-num" data-btn="4">4</button>
        <button class="key key-num" data-btn="5">5</button>
        <button class="key key-num" data-btn="6">6</button>

        <button class="key key-op" data-btn="sub">-</button>
        <button class="key key-num" data-btn="1">1</button>
        <button class="key key-num" data-btn="2">2</button>
        <button class="key key-num" data-btn="3">3</button>
        <button class="key key-op" data-btn="add">+</button>
        <button class="key key-num key-span" data-btn="0">0</button>
        <button class="key key-num" data-btn="dot">.</button>
        <button class="key key-eq" data-btn="eq">=</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
